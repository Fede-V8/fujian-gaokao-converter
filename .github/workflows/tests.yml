name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python 单元测试
        run: python3 -m unittest -v

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS 与 Python 数值对拍
        run: node tests/verify.mjs
      - name: 界面冒烟（模块版）
        run: node tests/dom-smoke.mjs
      - name: 重建单文件版并冒烟
        run: |
          node tools/build-standalone.mjs
          STANDALONE=1 node tests/dom-smoke.mjs
